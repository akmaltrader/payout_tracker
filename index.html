  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.16);
      --accent-payout: #10b981;
      --accent-invest: #f43f5e;
      --accent-cyan: #06b6d4;
      --accent-gold: #fbbf24;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; background-image: radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.07), transparent 35%), radial-gradient(circle at 88% 90%, rgba(244, 63, 94, 0.07), transparent 35%); }

    /* Header */
    header { background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--card-border); padding: 16px 22px; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .badge-year { background: linear-gradient(135deg, #10b981, #06b6d4); color: #022c22; font-weight: 800; font-size: 0.72rem; padding: 4px 9px; border-radius: 6px; letter-spacing: 0.5px; }
    .brand-title { font-size: 1.22rem; font-weight: 800; letter-spacing: -0.4px; color: #fff; }
    .brand-sub { font-size: 0.75rem; color: var(--text-sub); }

    .header-controls { display: flex; align-items: center; gap: 10px; }
    .currency-toggle { background: #0f172a; border: 1px solid var(--card-border); padding: 4px; border-radius: 10px; display: flex; gap: 4px; }
    .curr-btn { background: transparent; border: none; color: var(--text-sub); padding: 6px 12px; font-size: 0.78rem; font-weight: 700; border-radius: 7px; cursor: pointer; transition: 0.2s; }
    .curr-btn.active { background: #10b981; color: #022c22; }

    .container { max-width: 1280px; margin: 0 auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 24px; }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 15px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.35); transition: transform 0.2s, border-color 0.2s; }
    .kpi-card:hover { transform: translateY(-2px); border-color: var(--card-hover); }
    .kpi-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.6px; }
    .kpi-val { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
    .kpi-footer { font-size: 0.76rem; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card-payout { border-color: rgba(16, 185, 129, 0.35); }
    .card-payout .kpi-val { color: var(--accent-payout); }
